{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_heading %}Clôtures{% endblock %}

{% block content %}
<div class="container-fluid">
  <form method="post" novalidate>
    {% csrf_token %}

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="odoo-form-title mb-1">{{ title }}</h1>
        <div class="text-muted small">La réouverture doit rester exceptionnelle et motivée.</div>
      </div>
      <div class="d-flex gap-2">
        <a href="{% url 'reports:period_closure_detail' closure.pk %}" class="btn btn-outline-secondary rounded-3">Retour</a>
        <button type="submit" class="btn btn-dark rounded-3">Rouvrir</button>
      </div>
    </div>

    <div class="card odoo-sheet border-0 shadow-sm">
      <div class="card-body p-4 p-lg-5">
        <div class="col-md-12">
          <label class="form-label">Motif de réouverture</label>
          {{ form.reopen_reason }}
        </div>
      </div>
    </div>
  </form>
</div>
{% endblock %}
